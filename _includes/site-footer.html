<div class="site-footer-shell">
  <footer class="site-footer" role="contentinfo">
    <p class="site-footer__copyright">&copy; {{ site.time | date: '%Y' }} Zhixiong Yang</p>
    {% if site.histats_enabled and jekyll.environment == 'production' and page.analytics != false %}
    <div class="site-footer__traffic" role="group" aria-label="Today's visitors and total visitors">
      {% include histats-counter.html %}
      <a class="site-footer__traffic-info" href="https://www.histats.com/?act=5"
         target="_blank" rel="noopener noreferrer"
         title="Visitor counts are measured by Histats. Read its privacy policy.">Visitor statistics by Histats</a>
    </div>
    {% endif %}
    <p class="site-footer__meta">Last updated {{ site.time | date: '%B %Y' }}</p>
  </footer>
</div>
