name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public citation total
        env:
          GOOGLE_SCHOLAR_ID: HsuHMucAAAAJ
        run: python google_scholar_crawler/main.py
      - name: Update statistics branch
        shell: bash
        run: |
          cp google_scholar_crawler/results/gs_data.json "$RUNNER_TEMP/gs_data.json"
          if git ls-remote --exit-code --heads origin google-scholar-stats; then
            git fetch origin google-scholar-stats
            git switch -c google-scholar-stats FETCH_HEAD
          else
            git switch --orphan google-scholar-stats
          fi
          cp "$RUNNER_TEMP/gs_data.json" gs_data.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Google Scholar citation total'
          git push origin HEAD:google-scholar-stats
